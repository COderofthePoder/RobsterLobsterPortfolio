# Einmaliger Helfer: lädt die generierten Higgsfield-Assets ins Repo.
# Wird nach erfolgreichem Lauf wieder entfernt.
name: fetch-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          mkdir -p .assets-raw
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3E57IfNKFwjDkp4vDNphx7q5vPg"
          curl -fsSo .assets-raw/case-1.png "$base/hf_20260705_190125_efdf18d4-a4e3-4126-bead-ba47e8f8a249.png"
          curl -fsSo .assets-raw/case-2.png "$base/hf_20260705_190127_3d32c5e4-fb4e-486e-b05c-e047f276ed62.png"
          curl -fsSo .assets-raw/case-3.png "$base/hf_20260705_190129_41368b67-eac4-474b-86a9-5804b8f6609f.png"
          curl -fsSo .assets-raw/case-4.png "$base/hf_20260705_190131_5aea619e-e89a-455e-8043-a948434303bb.png"
          curl -fsSo .assets-raw/portrait.png "$base/hf_20260705_190134_c7447ee6-78c9-43b4-af15-2769da73da15.png"
          curl -fsSo .assets-raw/texture.png "$base/hf_20260705_190135_fed9bd81-2900-4631-a19d-8f4d81ee9112.png"
          curl -fsSo .assets-raw/hero.mp4 "$base/hf_20260705_190048_a4776196-be00-432b-9a4d-1bf7fd45054a.mp4"
          ls -la .assets-raw
      - name: Commit
        run: |
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          git add .assets-raw
          git commit -m "chore: Higgsfield-Rohassets via Action geladen"
          git push
