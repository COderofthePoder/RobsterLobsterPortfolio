# Einmaliger Helfer: lädt die Automation-Clips ins Repo. Wird danach entfernt.
name: fetch-assets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download & commit assets
        run: |
          if [ -f .assets-raw/workflow.mp4 ]; then echo "Assets vorhanden"; exit 0; fi
          mkdir -p .assets-raw
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3E57IfNKFwjDkp4vDNphx7q5vPg"
          curl -fsSo .assets-raw/workflow.mp4 "$base/hf_20260705_200200_1815440a-1cba-419c-b95a-c65012eafd2a.mp4"
          curl -fsSo .assets-raw/chatbot.mp4 "$base/hf_20260705_200202_37b6bfd8-da5f-4d39-ba0b-4b2cc12aca67.mp4"
          curl -fsSo .assets-raw/integrations.mp4 "$base/hf_20260705_200204_8aa76521-70d2-4849-a00d-65971a8fea93.mp4"
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          git add .assets-raw
          git commit -m "chore: Automation-Clips via Action geladen"
          git push
