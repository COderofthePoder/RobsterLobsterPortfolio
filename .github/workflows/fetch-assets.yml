name: fetch-assets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download & commit assets
        run: |
          if [ -f .assets-raw/chatbot2.mp4 ]; then echo "Assets vorhanden"; exit 0; fi
          mkdir -p .assets-raw
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3E57IfNKFwjDkp4vDNphx7q5vPg"
          curl -fsSo .assets-raw/chatbot2.mp4 "$base/hf_20260705_200424_20425c49-4c19-45e6-88c6-828ba68f69c6.mp4"
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          git add .assets-raw
          git commit -m "chore: neuer Chatbot-Clip via Action geladen"
          git push
